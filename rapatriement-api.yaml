openapi: 3.0.3
info:
  title: AVA Operation Exportateur API (Rapatriement)
  description: API for managing exportateur repatriation operations in the AVA system
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /api/operation-exportateur-ava/rapatriement/{Finalize}:
    post:
      summary: Créer une opération de rapatriement AVA
      description: |
        Crée une nouvelle opération exportateur AVA de type rapatriement avec validation des contraintes métier. 
        Si Finalize=true : logique complète (OperationExportateurAVA + MVT avec status='A' + mise à jour OperationsDeleguee) et un PDF est généré et retourné. 
        Si Finalize=false : création du MVT uniquement (mode brouillon).
      tags:
        - Opérations Exportateur AVA
      parameters:
        - name: Finalize
          in: path
          required: true
          description: true = logique complète + MVT status 'A' ; false = MVT uniquement
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationExportateurAVADTO'
            examples:
              succes_rapatriement_basique:
                summary: SUCCES - Rapatriement basique avec montant minimal
                value:
                  numDossierAva: 10001
                  dateDosRap: "2026-01-15"
                  mntRap: 1000.00
                  codeDevise: 788
                  numeroCompte: "1234567890123"
                  typePieceBenef: 1
                  noPieceBenef: "123456789"
                  codeProduitService: 1
      responses:
        '201':
          description: >
            Opération de rapatriement créée avec succès.
            Si un PDF est généré (Normalement quand Finalize=true), la réponse sera un fichier binaire de type application/pdf 
            et contiendra un header `X-Operation-Data` avec les détails JSON.
            S'il n'y a pas de PDF (ex: Finalize=false), la réponse sera directement un objet JSON `OperationExportateurAVADTO`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationExportateurAVADTO'
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            X-Operation-Data:
              description: JSON serialized version of the OperationExportateurAVADTO without the base64 PDF
              schema:
                type: string
        '400':
          description: Bad Request - Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found - Dossier not found
        '409':
          description: Conflict - Business rule violation (e.g., Montant exceeds limits)
        '500':
          description: Internal Server Error

components:
  schemas:
    OperationExportateurAVADTO:
      type: object
      required:
        - numDossierAva
        - dateDosRap
        - mntRap
        - codeDevise
        - numeroCompte
        - typePieceBenef
        - noPieceBenef
        - codeProduitService
      properties:
        numDossierAva:
          type: integer
          description: Numéro du dossier AVA (requis)
        dateDosRap:
          type: string
          format: date
          description: Date du dossier de rapatriement (requis)
        mntRap:
          type: number
          format: double
          description: Montant du rapatriement (requis)
        codeDevise:
          type: integer
          description: Code de la devise (requis)
        numeroCompte:
          type: string
          description: Numéro de compte (requis)
        typePieceBenef:
          type: integer
          enum: [1, 4, 7]
          description: Type de pièce du bénéficiaire (1=CIN, 4=Passeport, 7=Autre)
        noPieceBenef:
          type: string
          description: Numéro de pièce du bénéficiaire
        codeProduitService:
          type: integer
          description: Code du produit/service
        mntMvtTnd:
          type: number
          format: double
          description: Montant du mouvement en TND (généralement calculé automatiqument, par ex 25% du mntRap)
          readOnly: true
        pdfBase64:
          type: string
          description: PDF généré en base64 (Uniquement en JSON s'il y a une erreur dans son traitement ou s'il est explicitement demandé en DTO sans l'intercepteur binaire)
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        details:
          type: string
