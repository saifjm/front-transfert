spring.datasource.url=jdbc:oracle:thin:@37.187.250.163:1521/AVA_POC
spring.datasource.username=gen
spring.datasource.password=gen
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=none
server.port=8085

# Afficher les requetes SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

api.ava.base-url=http://localhost:8080

# Limit springdoc scanning to this module's packages to avoid scanning controllers referencing missing classes
springdoc.packagesToScan=com.example.avagen.controller

# Enable debug logs for springdoc to capture issues during /v3/api-docs generation
logging.level.org.springdoc=DEBUG
logging.level.org.springdoc.core=DEBUG
