spring.application.name=securite-service

# Server Configuration
server.port=8082

# Oracle Database Configuration for SECURITE
spring.datasource.url=jdbc:oracle:thin:@37.187.250.163:1521/ORCLPDB1
spring.datasource.username=securite
spring.datasource.password=securite
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=SECURITE
