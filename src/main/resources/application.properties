spring.application.name=securite-service

# Server Configuration
server.port=8082

# Oracle Database Configuration for SECURITE
spring.datasource.url=jdbc:oracle:thin:@37.187.250.163:1521/ORCLPDB1
spring.datasource.username=securite
spring.datasource.password=securite
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=SECURITE
=======



# -----------------------------------------------------------------
# Second datasource for authentication (auth)
# Uses schema user: securite
# -----------------------------------------------------------------
auth.datasource.url=jdbc:oracle:thin:@37.187.250.163:1521/ORCLPDB1
auth.datasource.username=securite
auth.datasource.password=securite
auth.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Optional JPA properties for auth EM (will fall back to application-level jpa props)
auth.jpa.hibernate.ddl-auto=none
auth.jpa.database-platform=org.hibernate.dialect.OracleDialect

# -----------------------------------------------------------------
# Third datasource for reference data (ref)
# Uses schema user: ref
# -----------------------------------------------------------------
ref.datasource.url=jdbc:oracle:thin:@37.187.250.163:1521/ORCLPDB1     
ref.datasource.username=ref
ref.datasource.password=ref
ref.datasource.driver-class-name=oracle.jdbc.OracleDriver
ref.jpa.hibernate.ddl-auto=none
ref.jpa.database-platform=org.hibernate.dialect.OracleDialect

# -----------------------------------------------------------------
# Domi module datasource (domi_domiciliation_22_agc)
# Non-primary EMF defined in AppDataSourceConfig with prefix domi.datasource
# -----------------------------------------------------------------
domi.datasource.url=jdbc:oracle:thin:@37.187.250.163:1521/ORCLPDB1
domi.datasource.username=domi
domi.datasource.password=domi
domi.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Optional
domi.jpa.hibernate.ddl-auto=none
domi.jpa.database-platform=org.hibernate.dialect.OracleDialect

# -----------------------------------------------------------------
# Owner datasource for domi module repositories under .Repository.owner
# Prefix expected by OwnerDataSourceConfig: app.owner.datasource
# -----------------------------------------------------------------
app.owner.datasource.url=jdbc:oracle:thin:@37.187.250.163:1521/ORCLPDB1
app.owner.datasource.username=ref
app.owner.datasource.password=ref
app.owner.datasource.driver-class-name=oracle.jdbc.OracleDriver



# -----------------------------------------------------------------
# ttn datasource for domi module repositories under .Repository.owner
# Prefix expected by OwnerDataSourceConfig: app.owner.datasource
# -----------------------------------------------------------------
ttn.datasource.url=jdbc:oracle:thin:@37.187.250.163:1521/ORCLPDB1
ttn.datasource.username=ttn
ttn.datasource.password=ttn
ttn.datasource.driver-class-name=oracle.jdbc.OracleDriver
ttn.local.path.image=/weblogic/Oracle/Middleware/Oracle_Home/Appserv/domi_images
ttn.http.base-url=/weblogic/Oracle/Middleware/Oracle_Home/Appserv/domi_images

# TTN SFTP Configuration (for file upload/delete to remote server)
# Enable SFTP uploads for TTN module (recommended if HTTP PUT/POST doesn't work)
ttn.sftp.enabled=false
ttn.sftp.host=145.239.69.46
ttn.sftp.port=22
ttn.sftp.username=your-username
ttn.sftp.password=your-password
ttn.sftp.remote-directory=/domi_images

# Alternative: Dedicated HTTP upload endpoint (if server provides one)
ttn.remote.upload-endpoint=http://145.239.69.46:7777/api/upload

# -----------------------------------------------------------------
# HTTP document download settings for domi module
# -----------------------------------------------------------------
app.http.base-url=/weblogic/Oracle/Middleware/Oracle_Home/Appserv/domi_images
# Where to save downloaded files (defaults to temp if not set)
app.local.path.image=/weblogic/Oracle/Middleware/Oracle_Home/Appserv/domi_images

