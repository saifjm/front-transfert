openapi: 3.0.3
info:
  title: API Clôture de Dossier (AVA1)
  description: Spécification de l'API pour la clôture d'un dossier dans l'application AVA.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/cloture
    description: Serveur de développement local AVA1
paths:
  /{numDossier}/{finalize}:
    post:
      summary: Clôturer un dossier
      description: |
        Permet de clôturer un dossier spécifique en fonction de son ID (`numDossier`).
        Si le paramètre `finalize` est à `true`, cela valide définitivement l'action, 
        sinon ce sera juste une validation métier sans modification définitive des états sensibles.
      operationId: cloturerDossier
      tags:
        - Clôture
      parameters:
        - name: numDossier
          in: path
          description: Le numéro (ID) unique du dossier à clôturer.
          required: true
          schema:
            type: integer
        - name: finalize
          in: path
          description: Flag de confirmation définitive (true/false).
          required: true
          schema:
            type: boolean
      requestBody:
        description: Les informations nécessaires pour clôturer le dossier.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClotureDTO'
      responses:
        '200':
          description: Dossier clôturé avec succès ou règles métier validées (selon finalize).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OuvertureDossierDTO'
        '422':
          description: Erreur de validation (business rules ou champs manquants).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessErrorResponse'
        '404':
          description: Dossier non trouvé.
components:
  schemas:
    ClotureDTO:
      type: object
      required:
        - motif
        - dateCloture
        - reference
      properties:
        motif:
          type: string
          description: "Le motif de la clôture (obligatoire)."
          example: "Clôture suite à une demande client"
        dateCloture:
          type: string
          format: date
          description: "Date de la clôture au format YYYY-MM-DD (obligatoire)."
          example: "2026-04-15"
        reference:
          type: string
          description: "Référence associée à la clôture (obligatoire)."
          example: "REF-CLOTURE-12345"
        observations:
          type: string
          description: "Observations supplémentaires (facultatif)."
          example: "Aucun problème relevé lors de l'opération."
    
    OuvertureDossierDTO:
      type: object
      description: "Objet complet représentant le dossier suite à sa validation (voir la spécification complète de l'objet)."
      
    BusinessErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 422
        error:
          type: string
          example: "Unprocessable Entity"
        message:
          type: string
          example: "VALIDATION_ERROR: motif : Le motif est obligatoire, dateCloture : La date de clôture est obligatoire"
        path:
          type: string
          example: "/api/cloture/123/true"
